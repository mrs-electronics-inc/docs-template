fail_fast: true
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint
        language: system
        files: \.(js|mjs|ts)$
      - id: prettier
        name: prettier
        entry: npx prettier --check
        language: system
        files: \.(js|mjs|ts|md|mdx|json|yml|yaml)$
